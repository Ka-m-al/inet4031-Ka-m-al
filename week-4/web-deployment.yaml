apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web
  template:
    metadata:
      labels:
        io.kompose.service: web
    spec:
      containers:
        - name: web
          image: docker.io/library/week-4-web:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: env
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: FLASK_SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://localhost:5000')"
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
